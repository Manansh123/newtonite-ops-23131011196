# Render Blueprint: one web service (API + built UI on the same origin) + one PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: newtonite-ops
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install --include=dev && npm --prefix frontend install --include=dev && npm run build
    startCommand: npm start            # runs migrations, seeds demo data once if the DB is empty, then starts the server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: newtonite-ops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true             # random 256-bit value generated by Render; never committed
      - key: SEED_DEMO_DATA
        value: "true"                   # demo deployment: seed on first boot only (never wipes existing data)

databases:
  - name: newtonite-ops-db
    plan: free
    databaseName: ops
    user: ops
